name: Katip Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: katip-android-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kod ZIP'i varsa aç ve depoya işle
        run: |
          if [ -f katip-kod.zip ]; then
            unzip -o katip-kod.zip
            rm katip-kod.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Katip kodu guncellendi" || true
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Katip.apk
          zip -j Katip-v1.5.0.zip Katip.apk
      - name: Publish release (APK direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Katip v${{ github.run_number }}
          files: |
            Katip.apk
            Katip-v1.5.0.zip
          make_latest: true
